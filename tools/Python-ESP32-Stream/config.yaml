connection:
  esp32_host: 10.45.1.9
  esp32_port: 8888
  use_broadcast: true
  broadcast_port: 8889
  broadcast_hold_time: 30
  reconnect_interval_sec: 3.0
  socket_timeout: 1.0
video:
  target_width: 320
  target_height: 170
  target_fps: 24.0
  generator_target_interval_sec: 0.03
  max_chunk_data_size: 8192
  gamma: 1.2
  wb_scale:
  - 1.1
  - 1.05
  - 0.95
  min_dirty_rect_threshold: 1
  max_dirty_rect_threshold: 180
  threshold_adjustment_step_up: 15
  threshold_adjustment_step_down: 5
  fps_history_size: 3
  fps_hysteresis_factor: 0.03
  frames_queue_max_size: 8
  generator_low_water_mark: 3
  heartbeat_interval_sec: 2.0
active_source: dashboard
ui:
  close_to_tray: true
  start_minimized: false
  tray_switch_source: true
sources:
  desktop:
    monitor: 0
    region: null
    crop_alignment: center
  window:
    window_title: 任务管理器
    crop_alignment: left
  dashboard:
    background: '#0B0F14'
    bg_image: null
    refresh_interval_sec: 1.0
    gap: 2
    widgets:
    - type: clock
      enabled: true
      color: '#FFD700'
      x: null
      y: null
      w: null
      scale: 1.0
    - type: cpu
      enabled: true
      color: '#00E676'
      sparkline: true
      x: null
      y: null
      w: null
      scale: 1.0
    - type: memory
      enabled: true
      color: '#40C4FF'
      x: null
      y: null
      w: null
      scale: 1.0
    - type: disk
      enabled: true
      color: '#FFAB40'
      path: C:\
      x: null
      y: null
      w: null
      scale: 1.0
    - type: net
      enabled: true
      color: '#E040FB'
      adapter: null
      x: null
      y: null
      w: null
      scale: 1.0
    - type: temp
      enabled: true
      color: '#FF7043'
      temp_enabled: {}
      x: null
      y: null
      w: null
      scale: 1.0
    - type: uptime
      enabled: false
      color: '#FFFFFF'
      x: null
      y: null
      w: null
      scale: 1.0
    - type: ip
      enabled: false
      color: '#AAAAAA'
      x: null
      y: null
      w: null
      scale: 1.0
    - type: custom_text
      enabled: false
      color: '#FFFFFF'
      text: ''
      x: null
      y: null
      w: null
      scale: 1.0
